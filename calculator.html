<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Items management and calculations</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            fetchPacks();

            document.getElementById('addPackForm').addEventListener('submit', function(e) {
                e.preventDefault();
                const itemSize = document.getElementById('itemSize').value;
                addPack(itemSize);
            });

            document.getElementById('calcForm').addEventListener('submit', function(e) {
                e.preventDefault();
                const items = document.getElementById('items').value;
                calculateOrder(items);
            });
        });


        function fetchPacks() {
            fetch('https://api.calculator.mikulic.dev/v1/packs')
                .then(response => response.json())
                .then(data => {
                    const sizesTable = document.getElementById('packTable').querySelector('tbody');
                    sizesTable.innerHTML = '';
                    data.sizes.forEach(size => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
              <td>${size.id}</td>
              <td>${size.item_size}</td>
              <td><button class="btn btn-danger" onclick="deletePack(${size.id})">Delete</button></td>
            `;
                        sizesTable.appendChild(row);
                    });
                })
                .catch(error => console.error('Error fetching packs:', error));
        }

        function addPack(itemSize) {
            let itemsAsNum = Number(itemSize);
            fetch('https://api.calculator.mikulic.dev/v1/packs', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ item_size: itemsAsNum }),
            })
                .then(response => response.json())
                .then(data => {
                    alert(data.message);
                    fetchPacks();
                    document.getElementById('itemSize').value = '';
                })
                .catch(error => console.error('Error adding pack:', error));
        }


        function deletePack(id) {
            fetch(`https://api.calculator.mikulic.dev/v1/packs/${id}`, {
                method: 'DELETE',
            })
                .then(() => {
                    alert('Pkg size has been deleted');
                    fetchPacks();
                })
                .catch(error => console.error('Error deleting pack:', error));
        }


        function calculateOrder(items) {
            let itemsAsNum = Number(items);
            fetch('https://api.calculator.mikulic.dev/v1/calculate', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ items: itemsAsNum }),
            })
                .then(response => response.json())
                .then(data => {
                    const order = data.order;
                    let orderDetails = '';
                    for (let key in order) {
                        orderDetails += `ID: ${key}, Qty: ${order[key]}<br>`;
                    }
                    document.getElementById('orderResult').innerHTML = orderDetails;
                })
                .catch(error => console.error('Error calculating order:', error));
        }
    </script>
</head>
<body class="container py-4">
<h1 class="mb-4">Items management and calculations</h1>

<h2>Pack sizes</h2>
<table class="table table-bordered" id="packTable">
    <thead>
    <tr>
        <th>ID</th>
        <th>Size</th>
        <th>Action</th>
    </tr>
    </thead>
    <tbody>
    </tbody>
</table>

<h2>Add new pack size</h2>
<form id="addPackForm" class="mb-4">
    <div class="mb-3">
        <label for="itemSize" class="form-label">Article items size(e.g. 500)</label>
        <input type="number" class="form-control" id="itemSize" required>
    </div>
    <button type="submit" class="btn btn-primary">Add</button>
</form>
<h2>Order</h2>
<form id="calcForm">
    <div class="mb-3">
        <label for="items" class="form-label">Enter items amount</label>
        <input type="number" class="form-control" id="items" required>
    </div>
    <button type="submit" class="btn btn-success">Calculate</button>
</form>


<h3>Calculation result</h3>
<div id="orderResult"></div>
</body>
</html>
